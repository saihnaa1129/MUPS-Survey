<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUPS — Судалгаа, асуумжийн систем</title>
<style>
:root{
 --site-primary:#173F5F;--site-secondary:#DCEAF2;--site-background:#F3F6F8;
 --site-on-primary:#FFFFFF;--site-on-secondary:#173F5F;--site-on-background:#172B3A;
 --site-font-body:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --site-font-heading:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --site-heading-scale:1;--site-spacing-scale:1;--site-radius-scale:1;--site-decoration-opacity:1;
 --surface:light-dark(#FFFFFF,#1D2935);--surface2:light-dark(#F8FAFC,#243443);
 --ink:light-dark(#172B3A,#E8F0F5);--muted:light-dark(#667987,#A9BBC7);
 --line:light-dark(#E1E8ED,#354654);--accent:#23866D;--danger:#C64D4D;
}
*{box-sizing:border-box}body{margin:0;background:var(--site-background);color:var(--ink);font-family:var(--site-font-body)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;background-color:var(--site-background);color:var(--site-on-background)}
.topbar{background:var(--site-primary);color:var(--site-on-primary);padding:18px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:12px;background:#FFFFFF22;display:grid;place-items:center;font-weight:800;letter-spacing:-1px}.brand h1{font-size:calc(18px * var(--site-heading-scale));margin:0}.brand p{font-size:12px;margin:3px 0 0;opacity:.75}.top-actions{display:flex;gap:8px;align-items:center}.user-chip{font-size:13px;opacity:.9}.layout{display:grid;grid-template-columns:238px minmax(0,1fr);max-width:1440px;margin:auto;min-height:calc(100vh - 76px)}
.sidebar{padding:24px 14px;border-right:1px solid var(--line);background:var(--surface)}.nav-label{font-size:10px;letter-spacing:1.2px;color:var(--muted);font-weight:800;padding:0 12px;margin:12px 0 8px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;color:var(--muted);display:flex;gap:11px;align-items:center;font-size:14px;margin:3px 0}.nav.active,.nav:hover{background:var(--site-secondary);color:var(--site-on-secondary);font-weight:700}.nav .ico{width:20px;text-align:center}.side-note{margin:28px 8px 0;padding:14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--muted);line-height:1.55}
main{padding:clamp(20px,3vw,40px);min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--accent);font-weight:800}.page-head h2{font-size:calc(27px * var(--site-heading-scale));letter-spacing:-.8px;margin:6px 0}.page-head p{color:var(--muted);margin:0;font-size:14px}.btn{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:650;font-size:13px}.btn.primary{background:var(--site-primary);border-color:var(--site-primary);color:white}.btn.green{background:var(--accent);border-color:var(--accent);color:white}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:16px}.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--surface);border:1px solid var(--line);border-radius:calc(15px * var(--site-radius-scale));padding:18px;min-width:0}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:32px;height:32px;border-radius:9px;background:var(--site-secondary);display:grid;place-items:center;color:var(--site-on-secondary)}.stat-num{font-size:28px;font-weight:800;letter-spacing:-1px;margin:13px 0 3px}.stat-foot{font-size:11px;color:var(--muted)}.two-col{grid-template-columns:1.25fr .75fr}.section-title{font-size:15px;font-weight:750;margin:0 0 14px}.survey-row{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.survey-row:first-of-type{border-top:0}.survey-name{font-weight:700;font-size:13px}.sub{font-size:11px;color:var(--muted);margin-top:4px}.pill{font-size:10px;font-weight:800;padding:5px 8px;border-radius:20px;background:#E1F3EC;color:#17684F;white-space:nowrap}.pill.gray{background:var(--surface2);color:var(--muted)}.barline{height:7px;border-radius:10px;background:var(--surface2);overflow:hidden;margin:8px 0 13px}.barline span{display:block;height:100%;background:var(--accent);border-radius:10px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:14px;color:var(--ink)}.quick strong{display:block;font-size:13px;margin:8px 0 3px}.quick span{font-size:11px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface2);color:var(--ink);outline:none}.field textarea{min-height:75px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.question-box{padding:14px;border:1px solid var(--line);border-radius:11px;margin:12px 0;background:var(--surface2)}.question-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.question-head b{font-size:13px}.muted{color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px}.chart-bars{display:flex;align-items:end;gap:14px;height:180px;padding:12px 8px 0;border-bottom:1px solid var(--line)}.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;height:100%;gap:7px;min-width:20px}.chart-col .bar{width:min(42px,80%);background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}.chart-col small{font-size:10px;color:var(--muted)}.chart-col b{font-size:10px}.metric{padding:13px;background:var(--surface2);border-radius:10px}.metric b{font-size:20px;display:block}.metric span{font-size:11px;color:var(--muted)}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hidden{display:none!important}.toast{position:fixed;bottom:22px;right:22px;background:#173F5F;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px #0002;font-size:13px;z-index:20}.modal-back{position:fixed;inset:0;background:#0A1A28A8;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal h3{margin:0 0 16px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.hint{font-size:11px;color:var(--muted);line-height:1.55}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,var(--site-primary),#286B77)}.auth-card{background:var(--surface);color:var(--ink);padding:30px;border-radius:18px;width:min(420px,100%);box-shadow:0 20px 60px #061b2b44}.auth-card h2{margin:8px 0}.auth-card p{color:var(--muted);font-size:13px;line-height:1.5}.tabs{display:flex;gap:6px;margin:18px 0}.tab{flex:1;padding:9px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:8px}.tab.active{background:var(--site-secondary);color:var(--site-on-secondary);font-weight:800}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.layout{grid-template-columns:190px 1fr}}
@media(max-width:620px){.layout{display:block}.sidebar{display:flex;overflow:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:3px}.nav{width:auto;white-space:nowrap;padding:9px 11px}.nav-label,.side-note{display:none}.topbar{padding:13px 16px}.user-chip{display:none}main{padding:18px 14px}.stats-grid{gap:9px}.card{padding:14px}.stat-num{font-size:23px}.page-head{align-items:center}.page-head h2{font-size:22px}.form-grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const demoQuestions=[{id:'q1',title:'Та аль түвшний суралцагч вэ?',type:'single',options:['1-р курс','2-р курс','3-р курс','4-р курс','Төгсөгч']},{id:'q2',title:'Сургалтын орчиндоо хэр сэтгэл хангалуун байдаг вэ?',type:'scale',options:['1','2','3','4','5']},{id:'q3',title:'Сайжруулах шаардлагатай чиглэлээ сонгоно уу',type:'multi',options:['Лекц','Лаборатори','Номын сан','Цахим сургалт']},{id:'q4',title:'Нэмэлт санал хүсэлт',type:'text',options:[]}];
const demoAnswers=[['2-р курс','4',['Лекц','Цахим сургалт'],'Лабораторийн тоног төхөөрөмжийг шинэчлэх'],['3-р курс','5',['Номын сан'],'Номын сангийн цагийг уртасгах'],['1-р курс','3',['Лекц','Номын сан'],'Цахим материал нэмэх'],['4-р курс','4',['Лаборатори'],'Практик хичээлийг нэмэгдүүлэх'],['2-р курс','2',['Лекц','Лаборатори'],'Сургалтын хуваарь сайжруулах'],['3-р курс','4',['Цахим сургалт'],'Сайн байна']];
let state={user:null,authMode:'login',page:'dashboard',surveys:[],responses:{},activeSurvey:null};
function load(){try{state.surveys=JSON.parse(localStorage.getItem('mups_surveys')||'null')||[{id:'demo',title:'Оюутны сэтгэл ханамжийн судалгаа',desc:'Сургалтын орчин, үйлчилгээний үнэлгээ',owner:'admin@mups.edu.mn',status:'active',questions:demoQuestions,created:new Date().toISOString()}];state.responses=JSON.parse(localStorage.getItem('mups_responses')||'null')||{demo:demoAnswers.map((a,i)=>({id:'r'+i,who:'Оролцогч '+(i+1),date:new Date().toISOString(),answers:a}))};}catch(e){state.surveys=[];state.responses={}}}
function save(){localStorage.setItem('mups_surveys',JSON.stringify(state.surveys));localStorage.setItem('mups_responses',JSON.stringify(state.responses))}
function toast(t){let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2600)}
function auth(){let root=$('#root');root.innerHTML=`<div class="auth"><div class="auth-card"><div class="brand"><div class="logo" style="background:var(--site-primary);color:white">M</div><div><h1 style="color:var(--ink);font-size:19px">MUPS Survey</h1><p>Судалгаа, асуумжийн платформ</p></div></div><h2>${state.authMode==='login'?'Нэвтрэх':'Бүртгэл үүсгэх'}</h2><p>Судалгаагаа удирдах, хариулт цуглуулах, үр дүн боловсруулах.</p><div class="tabs"><button class="tab ${state.authMode==='login'?'active':''}" onclick="setAuth('login')">Нэвтрэх</button><button class="tab ${state.authMode==='register'?'active':''}" onclick="setAuth('register')">Бүртгүүлэх</button></div><form onsubmit="authSubmit(event)">${state.authMode==='register'?`<div class="field"><label>Овог, нэр</label><input name="name" required placeholder="Нэрээ оруулна уу"></div>`:''}<div class="field"><label>И-мэйл хаяг</label><input name="email" type="email" required placeholder="name@example.com"></div><div class="field"><label>Нууц үг</label><input name="password" type="password" required minlength="4" placeholder="Нууц үг"></div>${state.authMode==='register'?`<div class="field"><label>Хэрэглэгчийн төрөл</label><select name="role"><option value="researcher">Судлаач</option><option value="participant">Оролцогч</option></select></div>`:''}<button class="btn primary" style="width:100%;margin-top:8px">${state.authMode==='login'?'Нэвтрэх':'Бүртгэл үүсгэх'}</button></form><p class="hint" style="margin-top:16px">Туршилтын хувилбар: бүртгэлийн мэдээлэл зөвхөн энэ браузерийн localStorage-д хадгалагдана. Бодит хэрэглээнд серверийн баталгаажуулалт шаардлагатай.</p><button class="btn" style="width:100%" onclick="demoLogin()">Демо хэрэглэгчээр үзэх</button></div></div>`}
function setAuth(m){state.authMode=m;auth()}
function demoLogin(){toast('Демо нэвтрэлт идэвхгүй. Бүртгэлтэй и-мэйл, нууц үгээр нэвтэрнэ үү')}
const navItems=[['dashboard','▦','Хяналтын самбар'],['surveys','▤','Миний асуумж'],['create','＋','Асуумж үүсгэх'],['answer','✎','Асуумж бөглөх'],['analytics','▥','Статистик тайлан'],['account','◉','Миний бүртгэл']];
function shell(){return `<div class="app"><header class="topbar"><div class="brand"><div class="logo">M</div><div><h1>MUPS Survey System</h1><p>Research • Collect • Analyze</p></div></div><div class="top-actions"><span class="user-chip">${esc(state.user.name)} · ${state.user.role==='participant'?'Оролцогч':'Судлаач'}</span><button class="btn small" onclick="logout()">Гарах ↗</button></div></header><div class="layout"><aside class="sidebar"><div class="nav-label">WORKSPACE</div>${navItems.map(([id,ic,n])=>`<button class="nav ${state.page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${n}</button>`).join('')}<div class="side-note"><b>MUPS Research Tools</b><br>Асуумжийн мэдээллээ нэг дор цуглуулж, статистик боловсруулалт хийгээрэй.</div></aside><main id="main"></main></div></div>`}
function logout(){state.user=null;sessionStorage.removeItem('mups_session');localStorage.removeItem('mups_user');auth()}function go(p){state.page=p;render()}
function render(){if(!state.user){auth();return}$('#root').innerHTML=shell();let m=$('#main');({dashboard:dashboard,surveys:surveys,create:create,answer:answer,analytics:analytics,account:account}[state.page]||dashboard)(m)}
function head(k,t,d,btn=''){return `<div class="page-head"><div><div class="eyebrow">${k}</div><h2>${t}</h2><p>${d}</p></div>${btn}</div>`}
function dashboard(m){let mine=state.surveys.filter(s=>s.owner===state.user.email||state.user.role==='researcher'),total=mine.reduce((n,s)=>n+(state.responses[s.id]||[]).length,0);m.innerHTML=head('OVERVIEW','Хяналтын самбар','Судалгааны ажлын ерөнхий мэдээлэл.',`<button class="btn primary" onclick="go('create')">＋ Шинэ асуумж</button>`)+`<div class="grid stats-grid"><div class="card"><div class="stat-top">Нийт асуумж <span class="stat-icon">▤</span></div><div class="stat-num">${mine.length}</div><div class="stat-foot">Үүсгэсэн судалгаа</div></div><div class="card"><div class="stat-top">Нийт хариулт <span class="stat-icon">✎</span></div><div class="stat-num">${total}</div><div class="stat-foot">Цугларсан хариулт</div></div><div class="card"><div class="stat-top">Идэвхтэй <span class="stat-icon">◉</span></div><div class="stat-num">${mine.filter(s=>s.status==='active').length}</div><div class="stat-foot">Хариулт авч байгаа</div></div><div class="card"><div class="stat-top">Тайлан <span class="stat-icon">▥</span></div><div class="stat-num">${mine.filter(s=>(state.responses[s.id]||[]).length).length}</div><div class="stat-foot">Өгөгдөлтэй судалгаа</div></div></div><div class="grid two-col"><section class="card"><h3 class="section-title">Сүүлийн асуумжууд</h3>${mine.slice(0,4).map(s=>`<div class="survey-row"><div><div class="survey-name">${esc(s.title)}</div><div class="sub">${(state.responses[s.id]||[]).length} хариулт · ${s.questions.length} асуулт</div></div><span class="pill ${s.status==='active'?'':'gray'}">${s.status==='active'?'Идэвхтэй':'Хаалттай'}</span></div>`).join('')||'<div class="empty">Одоогоор асуумж алга.</div>'}</section><section class="card"><h3 class="section-title">Шуурхай үйлдэл</h3><div class="quick"><button onclick="go('create')">✚<strong>Асуумж үүсгэх</strong><span>Шинэ судалгаа эхлүүлэх</span></button><button onclick="go('answer')">✎<strong>Бөглөх</strong><span>Нээлттэй асуумж</span></button><button onclick="go('analytics')">▥<strong>Статистик</strong><span>Үр дүн шинжлэх</span></button><button onclick="exportAll()">⇩<strong>Excel экспорт</strong><span>Бүх өгөгдөл татах</span></button></div></section></div>`}
function surveys(m){m.innerHTML=head('WORKSPACE','Миний асуумж','Асуумжаа удирдах, хариулт харах, түгээх.',`<button class="btn primary" onclick="go('create')">＋ Асуумж үүсгэх</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Асуумжийн нэр</th><th>Асуулт</th><th>Хариулт</th><th>Төлөв</th><th>Үйлдэл</th></tr></thead><tbody>${state.surveys.map(s=>`<tr><td><b>${esc(s.title)}</b><div class="sub">${esc(s.desc)}</div></td><td>${s.questions.length}</td><td>${(state.responses[s.id]||[]).length}</td><td><span class="pill ${s.status==='active'?'':'gray'}">${s.status==='active'?'Идэвхтэй':'Хаалттай'}</span></td><td><button class="btn small" onclick="selectSurvey('${s.id}')">Тайлан</button> <button class="btn small" onclick="copySurvey('${s.id}')">Линк</button> <button class="btn small" onclick="toggleSurvey('${s.id}')">${s.status==='active'?'Хаах':'Нээх'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function create(m){m.innerHTML=head('BUILDER','Асуумж үүсгэх','Асуултын төрөл, сонголтоо тохируулна уу.')+`<form class="panel" onsubmit="saveSurvey(event)"><div class="form-grid"><div class="field"><label>Асуумжийн нэр *</label><input name="title" required placeholder="Жишээ: Оюутны сэтгэл ханамж"></div><div class="field"><label>Төлөв</label><select name="status"><option value="active">Идэвхтэй</option><option value="closed">Хаалттай</option></select></div></div><div class="field"><label>Тайлбар</label><textarea name="desc" placeholder="Судалгааны зорилго, бөглөх заавар"></textarea></div><div style="display:flex;justify-content:space-between;align-items:center"><h3 class="section-title">Асуултууд</h3><button type="button" class="btn small" onclick="addQuestion()">＋ Асуулт нэмэх</button></div><div id="qList"><div class="question-box"><div class="question-head"><b>Асуулт 1</b><span class="pill">Сонголттой</span></div><div class="field" style="margin-top:12px"><input class="qtitle" required placeholder="Асуултаа бичнэ үү"></div><div class="form-grid"><div class="field"><label>Асуултын төрөл</label><select class="qtype" onchange="typeChanged(this)"><option value="single">Нэг сонголт</option><option value="multi">Олон сонголт</option><option value="scale">Үнэлгээ 1–5</option><option value="text">Нээлттэй текст</option><option value="number">Тоон утга</option></select></div><div class="field"><label>Сонголтууд (таслалаар тусгаарлана)</label><input class="qopts" placeholder="Тийм, Үгүй, Мэдэхгүй"></div></div></div></div><div class="modal-actions"><button type="button" class="btn" onclick="go('surveys')">Болих</button><button class="btn primary">Асуумж хадгалах</button></div></form>`}
function addQuestion(){let q=$('#qList'),n=q.children.length+1,d=document.createElement('div');d.className='question-box';d.innerHTML=`<div class="question-head"><b>Асуулт ${n}</b><button type="button" class="btn small" onclick="this.closest('.question-box').remove()">Устгах</button></div><div class="field" style="margin-top:12px"><input class="qtitle" required placeholder="Асуултаа бичнэ үү"></div><div class="form-grid"><div class="field"><label>Асуултын төрөл</label><select class="qtype" onchange="typeChanged(this)"><option value="single">Нэг сонголт</option><option value="multi">Олон сонголт</option><option value="scale">Үнэлгээ 1–5</option><option value="text">Нээлттэй текст</option><option value="number">Тоон утга</option></select></div><div class="field"><label>Сонголтууд</label><input class="qopts" placeholder="Тийм, Үгүй"></div></div>`;q.append(d)}
function typeChanged(el){el.closest('.question-box').querySelector('.qopts').disabled=['scale','text','number'].includes(el.value)}
function saveSurvey(e){e.preventDefault();let f=new FormData(e.target),qs=[...document.querySelectorAll('.question-box')].map((q,i)=>({id:'q'+Date.now()+i,title:q.querySelector('.qtitle').value,type:q.querySelector('.qtype').value,options:q.querySelector('.qopts').value.split(',').map(x=>x.trim()).filter(Boolean)}));let s={id:'s'+Date.now(),title:f.get('title'),desc:f.get('desc'),status:f.get('status'),owner:state.user.email,questions:qs,created:new Date().toISOString()};state.surveys.unshift(s);state.responses[s.id]=[];save();toast('Асуумж амжилттай хадгалагдлаа');go('surveys')}
function answer(m){let open=state.surveys.filter(s=>s.status==='active');m.innerHTML=head('PARTICIPATE','Асуумж бөглөх','Нээлттэй судалгаанаас сонгож бөглөнө үү.')+open.map(s=>`<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><b>${esc(s.title)}</b><div class="sub">${esc(s.desc)} · ${s.questions.length} асуулт</div></div><button class="btn primary" onclick="fillSurvey('${s.id}')">Бөглөх →</button></div></div>`).join('')||'<div class="panel empty">Одоогоор нээлттэй асуумж алга.</div>'}
function fillSurvey(id){let s=state.surveys.find(x=>x.id===id);if(!s)return;state.activeSurvey=id;let m=$('#main');m.innerHTML=head('RESPONSE',esc(s.title),esc(s.desc))+`<form class="panel" onsubmit="submitResponse(event)"><div class="hint" style="margin-bottom:16px">Бүх асуултад хариулна уу. Хариулт илгээсний дараа судалгааны эзэмшигчид харагдана.</div>${s.questions.map((q,i)=>`<div class="question-box"><b>${i+1}. ${esc(q.title)}</b>${q.type==='text'?`<div class="field" style="margin-top:12px"><textarea name="${q.id}" required></textarea></div>`:q.type==='number'?`<div class="field" style="margin-top:12px"><input name="${q.id}" type="number" required></div>`:q.type==='scale'?`<div style="display:flex;gap:18px;margin-top:14px">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="${q.id}" value="${v}" required> ${v}</label>`).join('')}</div>`:q.options.map(o=>`<label style="display:block;margin:10px 0;font-size:13px"><input type="${q.type==='multi'?'checkbox':'radio'}" name="${q.id}" value="${esc(o)}" ${q.type==='single'?'required':''}> ${esc(o)}</label>`).join('')}</div>`).join('')}<button class="btn primary">Хариулт илгээх</button> <button type="button" class="btn" onclick="go('answer')">Буцах</button></form>`}
function submitResponse(e){e.preventDefault();let s=state.surveys.find(x=>x.id===state.activeSurvey),fd=new FormData(e.target),a=s.questions.map(q=>q.type==='multi'?[...e.target.querySelectorAll(`[name="${q.id}"]:checked`)].map(x=>x.value):fd.get(q.id));(state.responses[s.id]??=[]).push({id:'r'+Date.now(),who:state.user.name+' ('+state.user.email+')',date:new Date().toISOString(),answers:a});save();toast('Хариулт амжилттай бүртгэгдлээ');go('answer')}
function selectSurvey(id){state.activeSurvey=id;go('analytics')}
function analytics(m){let s=state.surveys.find(x=>x.id===state.activeSurvey)||state.surveys[0];if(!s){m.innerHTML=head('ANALYTICS','Статистик тайлан','Өгөгдөлд дүн шинжилгээ хийх')+'<div class="panel empty">Эхлээд асуумж үүсгэнэ үү.</div>';return}state.activeSurvey=s.id;let rs=state.responses[s.id]||[];m.innerHTML=head('ANALYTICS','Статистик тайлан','Давтамж, хувь, дундаж, найдвартай байдал, корреляцийн шинжилгээ.',`<button class="btn green" onclick="exportSurvey('${s.id}')">⇩ Excel-д татах</button>`)+`<div class="panel"><div class="field"><label>Судалгаа сонгох</label><select onchange="selectSurvey(this.value)">${state.surveys.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="metric-grid"><div class="metric"><b>${rs.length}</b><span>Нийт оролцогч</span></div><div class="metric"><b>${s.questions.length}</b><span>Асуултын тоо</span></div><div class="metric"><b>${rs.length?Math.round(rs.length/s.questions.length*10)/10:0}</b><span>Өгөгдлийн мөр/асуулт</span></div></div></div><div class="grid two-col"><section class="panel"><h3 class="section-title">Давтамж ба тархалт</h3>${s.questions.map((q,i)=>renderFrequency(q,i,rs)).join('')}</section><section class="panel"><h3 class="section-title">Тоон үзүүлэлт</h3>${renderNumeric(s,rs)}<h3 class="section-title" style="margin-top:22px">Найдвартай байдал</h3>${renderAlpha(s,rs)}<h3 class="section-title" style="margin-top:22px">Корреляци</h3>${renderCorrelation(s,rs)}</section></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h3 class="section-title">Түүхий өгөгдөл</h3><button class="btn small" onclick="exportSurvey('${s.id}')">CSV / Excel-д нээх</button></div><div class="table-wrap">${renderTable(s,rs)}</div></div>`}
function renderFrequency(q,i,rs){let vals=rs.map(r=>r.answers[i]).filter(v=>v!==''&&v!=null),flat=vals.flatMap(v=>Array.isArray(v)?v:[v]),freq={};flat.forEach(v=>freq[v]=(freq[v]||0)+1);if(!flat.length)return `<div class="question-box"><b>${esc(q.title)}</b><div class="sub">Одоогоор хариулт алга.</div></div>`;let entries=Object.entries(freq).sort((a,b)=>b[1]-a[1]);return `<div class="question-box"><b>${esc(q.title)}</b><div class="sub">Хариулсан: ${vals.length} · Нийт сонголт: ${flat.length}</div>${entries.map(([k,v])=>`<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:12px"><span>${esc(k)}</span><b>${v} (${Math.round(v/flat.length*100)}%)</b></div><div class="barline"><span style="width:${v/flat.length*100}%"></span></div>`).join('')}</div>`}
function nums(s,rs){let cols=s.questions.map((q,i)=>rs.map(r=>r.answers[i]).map(v=>Array.isArray(v)?NaN:Number(v)).filter(Number.isFinite));return cols}
function mean(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN}function sd(a){if(a.length<2)return NaN;let m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))}function renderNumeric(s,rs){let cols=nums(s,rs),items=s.questions.map((q,i)=>({q,a:cols[i]})).filter(x=>x.a.length);if(!items.length)return '<p class="hint">Тоон болон 1–5 үнэлгээний өгөгдөл шаардлагатай.</p>';return items.map(x=>`<div class="question-box"><b>${esc(x.q.title)}</b><div class="metric-grid" style="margin-top:10px"><div class="metric"><b>${mean(x.a).toFixed(2)}</b><span>Mean</span></div><div class="metric"><b>${sd(x.a).toFixed(2)}</b><span>SD</span></div><div class="metric"><b>${[...x.a].sort((a,b)=>a-b)[Math.floor(x.a.length/2)]}</b><span>Median*</span></div></div><div class="hint">* Median нь эрэмбэлсэн утгын дундах ажиглалт.</div></div>`).join('')}
function renderAlpha(s,rs){let cols=nums(s,rs).filter(a=>a.length===rs.length&&a.length>1);if(cols.length<2)return '<p class="hint">Cronbach’s alpha тооцоход дор хаяж 2 тоон/Likert асуулт болон бүрэн хариулттай мөрүүд хэрэгтэй.</p>';let k=cols.length,tot=rs.map((r,i)=>cols.reduce((v,c)=>v+c[i],0)),sumVar=cols.reduce((v,c)=>v+sd(c)**2,0),alpha=k/(k-1)*(1-sumVar/(sd(tot)**2));return `<div class="metric"><b>${Number.isFinite(alpha)?alpha.toFixed(3):'Тооцоолох боломжгүй'}</b><span>Cronbach’s alpha · ${k} item</span></div><p class="hint">Зөвхөн бүрэн тоон/Likert өгөгдөлтэй асуултуудыг ашиглав. Үр дүнг судалгааны арга зүйн хүрээнд тайлбарлана.</p>`}
function pearson(x,y){let mx=mean(x),my=mean(y),num=0,dx=0,dy=0;for(let i=0;i<x.length;i++){num+=(x[i]-mx)*(y[i]-my);dx+=(x[i]-mx)**2;dy+=(y[i]-my)**2}return num/Math.sqrt(dx*dy)}
function renderCorrelation(s,rs){let cols=nums(s,rs).filter(a=>a.length===rs.length&&a.length>2);if(cols.length<2)return '<p class="hint">Корреляци тооцоход дор хаяж 2 тоон/Likert асуулт, 3-аас дээш бүрэн хариулт хэрэгтэй.</p>';let r=pearson(cols[0],cols[1]);return `<div class="metric"><b>${Number.isFinite(r)?r.toFixed(3):'Тооцоолох боломжгүй'}</b><span>Pearson r · эхний 2 тоон асуулт</span></div><p class="hint">r нь шугаман хамаарлын чиглэл, хүчийг илэрхийлнэ. Хамаарал нь шалтгаант холбоог нотлохгүй.</p>`}
function renderTable(s,rs){if(!rs.length)return '<div class="empty">Хариулт бүртгэгдээгүй байна.</div>';return `<table><thead><tr><th>№</th><th>Оролцогч</th><th>Огноо</th>${s.questions.map(q=>`<th>${esc(q.title)}</th>`).join('')}</tr></thead><tbody>${rs.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.who)}</td><td>${new Date(r.date).toLocaleDateString('mn-MN')}</td>${r.answers.map(a=>`<td>${esc(Array.isArray(a)?a.join('; '):a)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportSurvey(id){let s=state.surveys.find(x=>x.id===id),rs=state.responses[id]||[];let rows=[['№','Оролцогч','Огноо',...s.questions.map(q=>q.title)],...rs.map((r,i)=>[i+1,r.who,r.date,...r.answers.map(a=>Array.isArray(a)?a.join('; '):a)])];downloadCSV(rows,slug(s.title)+'.csv');toast('Excel-д нээх CSV файл татагдлаа')}
function exportAll(){let rows=[['Асуумж','Оролцогч','Огноо','Асуулт','Хариулт']];state.surveys.forEach(s=>(state.responses[s.id]||[]).forEach(r=>s.questions.forEach((q,i)=>rows.push([s.title,r.who,r.date,q.title,Array.isArray(r.answers[i])?r.answers[i].join('; '):r.answers[i]]))));downloadCSV(rows,'MUPS_Survey_All_Responses.csv')}
function downloadCSV(rows,name){let csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}function slug(s){return s.toLowerCase().replace(/[^a-z0-9а-яё]+/gi,'_').slice(0,50)}
function copySurvey(id){let url=location.href.split('#')[0]+'#survey='+id;navigator.clipboard?.writeText(url).then(()=>toast('Асуумжийн холбоос хууллаа')).catch(()=>toast(url))}function toggleSurvey(id){let s=state.surveys.find(x=>x.id===id);s.status=s.status==='active'?'closed':'active';save();render()}
function account(m){m.innerHTML=head('PROFILE','Миний бүртгэл','Хэрэглэгчийн мэдээлэл, эрхийн тохиргоо.')+`<div class="panel" style="max-width:620px"><div class="field"><label>Нэр</label><input value="${esc(state.user.name)}" disabled></div><div class="field"><label>И-мэйл</label><input value="${esc(state.user.email)}" disabled></div><div class="field"><label>Эрхийн төрөл</label><input value="${state.user.role==='participant'?'Оролцогч':'Судлаач'}" disabled></div><p class="hint">Демо хувилбарт хэрэглэгчийн бүртгэл браузер дотор хадгалагдана. Олон хэрэглэгчийн бодит бүртгэл, нууц үгийн хамгаалалт, серверийн өгөгдлийн санг дараагийн хөгжүүлэлтийн шатанд холбоно.</p></div>`}

function numericColumns(s,rs){return s.questions.map((q,i)=>({q,index:i,values:rs.map(r=>r.answers[i]).filter(v=>v!==''&&v!==null&&v!==undefined&&!Array.isArray(v)&&Number.isFinite(Number(v))).map(Number)})).filter(x=>x.values.length)}
function medianOf(a){if(!a.length)return NaN;let b=[...a].sort((x,y)=>x-y),n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2}
function varianceOf(a){if(a.length<2)return NaN;let m=mean(a);return a.reduce((z,v)=>z+(v-m)*(v-m),0)/(a.length-1)}
function renderNumeric(s,rs){let items=numericColumns(s,rs);if(!items.length)return '<p class="hint">Тоон болон Likert үнэлгээний өгөгдөл шаардлагатай.</p>';return items.map(x=>{let a=x.values;return '<div class="question-box"><b>'+esc(x.q.title)+'</b><div class="metric-grid" style="margin-top:10px"><div class="metric"><b>'+mean(a).toFixed(2)+'</b><span>Mean</span></div><div class="metric"><b>'+(Number.isFinite(sd(a))?sd(a).toFixed(2):'—')+'</b><span>SD</span></div><div class="metric"><b>'+medianOf(a).toFixed(2)+'</b><span>Median</span></div><div class="metric"><b>'+Math.min(...a)+'</b><span>Min</span></div><div class="metric"><b>'+Math.max(...a)+'</b><span>Max</span></div><div class="metric"><b>'+a.length+'</b><span>N</span></div></div></div>'}).join('')}
function completeNumericMatrix(s,rs){let cols=s.questions.map((q,i)=>({q,index:i})).filter(x=>['scale','number'].includes(x.q.type));let rows=rs.map(r=>cols.map(c=>{let v=r.answers[c.index];return v!==''&&v!==null&&Number.isFinite(Number(v))?Number(v):NaN})).filter(row=>row.length>=2&&row.every(Number.isFinite));return {cols,rows}}
function renderAlpha(s,rs){let d=completeNumericMatrix(s,rs),k=d.cols.length;if(k<2||d.rows.length<2)return '<p class="hint">Cronbach’s alpha тооцоход 2-оос доошгүй Likert/тоон асуулт, бүрэн хариулттай 2-оос доошгүй оролцогч шаардлагатай.</p>';let itemVars=d.cols.map((c,j)=>varianceOf(d.rows.map(r=>r[j]))),totals=d.rows.map(r=>r.reduce((a,b)=>a+b,0)),totalVar=varianceOf(totals),alpha=totalVar>0?k/(k-1)*(1-itemVars.reduce((a,b)=>a+b,0)/totalVar):NaN;return '<div class="metric"><b>'+(Number.isFinite(alpha)?alpha.toFixed(3):'Тооцоолох боломжгүй')+'</b><span>Cronbach’s alpha · '+k+' item · N='+d.rows.length+'</span></div><p class="hint">Бүрэн хариулттай мөрүүдийг ашигласан. Alpha нь хэмжүүрийн дотоод нийцлийг үнэлэх үзүүлэлт бөгөөд судалгааны агуулга, хэмжээсийн бүтцийг дангаараа батлахгүй.</p>'}
function renderCorrelation(s,rs){let d=completeNumericMatrix(s,rs);if(d.cols.length<2||d.rows.length<3)return '<p class="hint">Корреляцийн матрицад 2-оос доошгүй тоон/Likert асуулт, 3-аас доошгүй бүрэн хариулт шаардлагатай.</p>';let cols=d.cols,rows=d.rows,html='<div class="table-wrap"><table><thead><tr><th>Хувьсагч</th>'+cols.map(c=>'<th>'+esc(c.q.title.slice(0,22))+'</th>').join('')+'</tr></thead><tbody>';cols.forEach((c,i)=>{html+='<tr><th>'+esc(c.q.title.slice(0,22))+'</th>';cols.forEach((z,j)=>{let x=rows.map(r=>r[i]),y=rows.map(r=>r[j]),v=i===j?1:pearson(x,y);html+='<td>'+(Number.isFinite(v)?v.toFixed(3):'—')+'</td>'});html+='</tr>'});return html+'</tbody></table></div><p class="hint">Pearson корреляцийн коэффициент (r). Корреляци нь шалтгаант холбоог нотлохгүй. N='+rows.length+'.</p>'}
function reportHtml(s,rs){let out='<h1>'+esc(s.title)+'</h1><p>'+esc(s.desc||'')+'</p><p>Оролцогчдын тоо: '+rs.length+' | Асуултын тоо: '+s.questions.length+'</p>';s.questions.forEach((q,i)=>{let vals=rs.map(r=>r.answers[i]).filter(v=>v!==''&&v!=null),flat=vals.flatMap(v=>Array.isArray(v)?v:[v]),freq={};flat.forEach(v=>freq[v]=(freq[v]||0)+1);out+='<h2>'+(i+1)+'. '+esc(q.title)+'</h2><p>Хариулсан: '+vals.length+'</p><table border="1" cellspacing="0" cellpadding="5"><tr><th>Хариулт</th><th>Давтамж</th><th>Хувь</th></tr>'+Object.entries(freq).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+v+'</td><td>'+(flat.length?(100*v/flat.length).toFixed(1):0)+'%</td></tr>').join('')+'</table>';if(['scale','number'].includes(q.type)){let a=vals.map(Number).filter(Number.isFinite);if(a.length)out+='<p>Mean: '+mean(a).toFixed(2)+'; SD: '+(Number.isFinite(sd(a))?sd(a).toFixed(2):'—')+'; Median: '+medianOf(a).toFixed(2)+'; N: '+a.length+'</p>'}});return '<html><head><meta charset="utf-8"><title>Судалгааны тайлан</title><style>body{font:12pt Arial,sans-serif;margin:2cm;color:#222}h1{font-size:20pt}h2{font-size:14pt;margin-top:24px}table{border-collapse:collapse;width:100%}td,th{padding:6px;text-align:left}</style></head><body>'+out+'<p><small>MUPS Survey System · '+new Date().toLocaleDateString('mn-MN')+'</small></p></body></html>'}
function downloadWordReport(id){let s=state.surveys.find(x=>x.id===id),rs=state.responses[id]||[];if(!s)return;let blob=new Blob(['\ufeff',reportHtml(s,rs)],{type:'application/msword;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=slug(s.title)+'_tailan.doc';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Word тайлан татагдлаа')}
function printReport(id){let s=state.surveys.find(x=>x.id===id),rs=state.responses[id]||[];if(!s)return;let w=window.open('','_blank');if(!w){toast('Popup зөвшөөрлийг идэвхжүүлээд дахин оролдоно уу');return}w.document.write(reportHtml(s,rs));w.document.close();w.focus();setTimeout(()=>w.print(),400)}
async function exportSurvey(id){let s=state.surveys.find(x=>x.id===id),rs=state.responses[id]||[];if(!s)return;let rows=[['№','Оролцогч','Огноо',...s.questions.map(q=>q.title)],...rs.map((r,i)=>[i+1,r.who,r.date,...r.answers.map(a=>Array.isArray(a)?a.join('; '):a)])];if(window.XLSX){let wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,'Responses');XLSX.writeFile(wb,slug(s.title)+'.xlsx');toast('XLSX файл татагдлаа');return}try{await new Promise((resolve,reject)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=resolve;sc.onerror=reject;document.head.append(sc)});let wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,'Responses');XLSX.writeFile(wb,slug(s.title)+'.xlsx');toast('XLSX файл татагдлаа')}catch(e){downloadCSV(rows,slug(s.title)+'.csv');toast('XLSX сан ачаалсангүй. CSV хувилбар татагдлаа')}}

async function authPasswordHash(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(salt),iterations:120000,hash:'SHA-256'},key,256);return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,'0')).join('')}
async function authSubmit(e){e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')||'').trim().toLowerCase(),password=String(f.get('password')||''),accounts=JSON.parse(localStorage.getItem('mups_accounts')||'[]');if(!email||!password){toast('И-мэйл болон нууц үгээ оруулна уу');return}if(password.length<8){toast('Нууц үг 8-аас доошгүй тэмдэгт байх ёстой');return}if(!window.crypto?.subtle){toast('Нууц үгийн баталгаажуулалт хийхийн тулд HTTPS хаягаар нээнэ үү');return}try{let user;if(state.authMode==='register'){if(accounts.some(a=>a.email===email)){toast('Энэ и-мэйл өмнө нь бүртгэгдсэн байна');return}const code=String(f.get('inviteCode')||'').trim().toUpperCase();if(code){const invites=JSON.parse(localStorage.getItem('mups_invites')||'[]'),hit=invites.find(x=>x.code===code&&!x.used);if(!hit){toast('Урилгын код буруу эсвэл ашиглагдсан байна');return}hit.used=true;localStorage.setItem('mups_invites',JSON.stringify(invites))}const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)));const passwordHash=await authPasswordHash(password,salt);user={name:String(f.get('name')||email.split('@')[0]).trim(),email,role:f.get('role')||'researcher'};accounts.push({email,salt,passwordHash,user});localStorage.setItem('mups_accounts',JSON.stringify(accounts));toast('Бүртгэл амжилттай үүслээ')}else{const account=accounts.find(a=>a.email===email);if(!account){toast('Энэ и-мэйл бүртгэлгүй байна. Эхлээд бүртгүүлнэ үү');return}const enteredHash=await authPasswordHash(password,account.salt);if(enteredHash!==account.passwordHash){toast('И-мэйл эсвэл нууц үг буруу байна');return}user=account.user}state.user=user;sessionStorage.setItem('mups_session',JSON.stringify(user));render()}catch(error){console.error(error);toast('Нэвтрэх үйлдэл амжилтгүй боллоо. Дахин оролдоно уу')}}
function createInvite(){let invites=JSON.parse(localStorage.getItem('mups_invites')||'[]'),code='MUPS-'+Math.random().toString(36).slice(2,8).toUpperCase();invites.push({code:code,created:new Date().toISOString(),used:false});localStorage.setItem('mups_invites',JSON.stringify(invites));let box=$('#inviteOutput');if(box)box.innerHTML='<b>Шинэ урилгын код: '+esc(code)+'</b><p class="hint">Энэ кодыг бүртгүүлэх хүнд дамжуулна уу. Демо хувилбарт код зөвхөн энэ браузерт хүчинтэй.</p><button class="btn small" onclick="GenCopyInvite(\''+code+'\')">Код хуулах</button>';toast('Урилгын код үүслээ')}

<script>
window.MUPS_BACKEND_CONFIG = window.MUPS_BACKEND_CONFIG || {
  supabaseUrl: '',
  supabasePublishableKey: ''
};
window.MUPS_BACKEND = {
  client: null,
  status: 'not_configured',
  async connect() {
    const cfg = window.MUPS_BACKEND_CONFIG || {};
    if (!cfg.supabaseUrl || !cfg.supabasePublishableKey) {
      this.status = 'not_configured';
      return { ok: false, message: 'Supabase URL болон publishable key тохируулаагүй байна.' };
    }
    try {
      if (!window.supabase?.createClient) {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
          script.onload = resolve;
          script.onerror = () => reject(new Error('Supabase client сан ачаалсангүй.'));
          document.head.appendChild(script);
        });
      }
      this.client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey);
      this.status = 'client_initialized';
      window.dispatchEvent(new CustomEvent('mups-backend-status', { detail: { status: this.status } }));
      return { ok: true, message: 'Supabase client амжилттай эхэллээ. Өгөгдлийн сангийн CRUD холболт хараахан хийгдээгүй.' };
    } catch (error) {
      this.status = 'connection_error';
      window.dispatchEvent(new CustomEvent('mups-backend-status', { detail: { status: this.status } }));
      return { ok: false, message: error.message || 'Серверийн client холболт амжилтгүй.' };
    }
  }
};
window.MUPS_BACKEND.connect().then(result => {
  console.info('[MUPS backend]', result.message);
});
</script>
<script>
// Монгол хэлний интерфэйс: динамикаар үүсэх цонх, товч, тайлангийн шошгыг мөн хөрвүүлнэ.
(function(){
  const words={
    'MUPS Survey System':'MUPS — Судалгаа, асуумжийн систем',
    'Research • Collect • Analyze':'Судал • Цуглуул • Шинжил',
    'WORKSPACE':'АЖЛЫН ОРЧИН','OVERVIEW':'ЕРӨНХИЙ МЭДЭЭЛЭЛ','BUILDER':'АСУУМЖ БОЛОВСРУУЛАХ',
    'PARTICIPATE':'СУДАЛГААНД ОРОЛЦОХ','RESPONSE':'ХАРИУЛТ','ANALYTICS':'СТАТИСТИК ШИНЖИЛГЭЭ','PROFILE':'ХУВИЙН БҮРТГЭЛ',
    'Mean':'Дундаж','SD':'Стандарт хазайлт','Median':'Медиан','Median*':'Медиан*','Min':'Хамгийн бага','Max':'Хамгийн их','N':'Ажиглалтын тоо',
    'Cronbach’s alpha':'Кронбахын альфа','Cronbach\'s alpha':'Кронбахын альфа','Pearson correlation coefficient':'Пирсоны корреляцийн коэффициент',
    'Pearson r':'Пирсоны r','Pearson':'Пирсон','item':'асуулт','Responses':'Хариултууд',
    'name@example.com':'И-мэйл хаягаа оруулна уу','MUPS-XXXXXX':'MUPS-XXXXXX'
  };
  const exact=new Map(Object.entries(words));
  const pattern=/\b(?:WORKSPACE|OVERVIEW|BUILDER|PARTICIPATE|RESPONSE|ANALYTICS|PROFILE|Mean|Median\*?|SD|Min|Max|Pearson|item|Responses)\b|Cronbach’s alpha|Cronbach's alpha|Pearson r|MUPS Survey System|Research • Collect • Analyze/g;
  function translate(root){
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let node;while((node=walker.nextNode())){if(!node.nodeValue.trim())continue;node.nodeValue=node.nodeValue.replace(pattern,m=>exact.get(m)||m)}
    root.querySelectorAll('input[placeholder],textarea[placeholder],button[title]').forEach(el=>{
      for(const attr of ['placeholder','title'])if(el.hasAttribute(attr)){const v=el.getAttribute(attr);if(exact.has(v))el.setAttribute(attr,exact.get(v))}
    });
  }
  const start=()=>{translate(document.body);new MutationObserver(records=>records.forEach(r=>r.addedNodes.forEach(n=>{if(n.nodeType===Node.TEXT_NODE){if(n.nodeValue.trim())n.nodeValue=n.nodeValue.replace(pattern,m=>exact.get(m)||m)}else if(n.nodeType===Node.ELEMENT_NODE)translate(n)}))).observe(document.body,{childList:true,subtree:true});};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
<script>
// Тайлангийн тусдаа цонхонд үндсэн интерфэйсийн хэлний тохиргоо үйлчлэхгүй тул
// тайлан үүсгэх HTML-д мэргэжлийн нэр томьёог шууд монголчилно.
(function(){
  if(typeof window.reportHtml!=='function') return;
  const originalReportHtml=window.reportHtml;
  window.reportHtml=function(s,rs){
    let html=originalReportHtml(s,rs);
    const replacements=[
      [/MUPS Survey System/g,'MUPS — Судалгаа, асуумжийн систем'],
      [/Mean:/g,'Дундаж:'],[/SD:/g,'Стандарт хазайлт:'],
      [/Median:/g,'Медиан:'],[/\bN=/g,'Ажиглалтын тоо='],
      [/Cronbach’s alpha/g,'Кронбахын альфа'],
      [/Pearson correlation coefficient \(r\)/g,'Пирсоны корреляцийн коэффициент (r)'],
      [/Pearson correlation coefficient/g,'Пирсоны корреляцийн коэффициент'],
      [/\bMean\b/g,'Дундаж'],[/\bMedian\b/g,'Медиан'],
      [/\bResponses\b/g,'Хариултууд'],[/\bFrequency\b/g,'Давтамж'],[/\bPercentage\b/g,'Хувь']
    ];
    for(const [pattern,value] of replacements) html=html.replace(pattern,value);
    return html;
  };
})();
</script>
<script>

function surveys(m){
  const mine=state.surveys.filter(s=>s.owner===state.user.email);
  m.innerHTML=head('WORKSPACE','Миний асуумж','Өөрийн асуумжаа удирдах, хариулт харах, түгээх.',`<button class="btn primary" onclick="go('create')">＋ Асуумж үүсгэх</button>`)+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Асуумжийн нэр</th><th>Асуулт</th><th>Хариулт</th><th>Төлөв</th><th>Үйлдэл</th></tr></thead><tbody>${mine.map(s=>`<tr><td><b>${esc(s.title)}</b><div class="sub">${esc(s.desc)}</div></td><td>${s.questions.length}</td><td>${(state.responses[s.id]||[]).length}</td><td><span class="pill ${s.status==='active'?'':'gray'}">${s.status==='active'?'Идэвхтэй':'Хаалттай'}</span></td><td><button class="btn small" onclick="selectSurvey('${s.id}')">Тайлан</button> <button class="btn small" onclick="copySurvey('${s.id}')">Линк</button> <button class="btn small" onclick="toggleSurvey('${s.id}')">${s.status==='active'?'Хаах':'Нээх'}</button></td></tr>`).join('')||'<tr><td colspan="5">Одоогоор өөрийн асуумж алга.</td></tr>'}</tbody></table></div></div>`;
}
function saveSurvey(e){
  e.preventDefault();
  if(state.user.role!=='researcher'){toast('Асуумж үүсгэх эрхгүй байна');return;}
  const f=new FormData(e.target),boxes=[...document.querySelectorAll('#qList .question-box')];
  if(!boxes.length){toast('Дор хаяж нэг асуулт нэмнэ үү');return;}
  const qs=boxes.map((q,i)=>({id:'q'+Date.now()+i,title:q.querySelector('.qtitle').value.trim(),type:q.querySelector('.qtype').value,options:q.querySelector('.qopts').value.split(',').map(x=>x.trim()).filter(Boolean)}));
  if(qs.some(q=>!q.title||(['single','multi'].includes(q.type)&&q.options.length<2))){toast('Асуултын текст болон сонголтуудыг бүрэн оруулна уу. Сонголттой асуултад 2-оос доошгүй сонголт шаардлагатай.');return;}
  const s={id:'s'+Date.now(),title:String(f.get('title')||'').trim(),desc:String(f.get('desc')||'').trim(),status:f.get('status')==='closed'?'closed':'active',owner:state.user.email,questions:qs,created:new Date().toISOString()};
  if(!s.title){toast('Асуумжийн нэрийг оруулна уу');return;}
  state.surveys.unshift(s);state.responses[s.id]=[];save();toast('Асуумж амжилттай хадгалагдлаа');go('surveys');
}
function submitResponse(e){
  e.preventDefault();
  const s=state.surveys.find(x=>x.id===state.activeSurvey);
  if(!s||s.status!=='active'){toast('Энэ асуумж хаагдсан эсвэл олдсонгүй');go('answer');return;}
  const fd=new FormData(e.target),answers=s.questions.map(q=>q.type==='multi'?[...e.target.querySelectorAll(`[name="${q.id}"]:checked`)].map(x=>x.value):fd.get(q.id));
  if(answers.some(v=>v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length))){toast('Бүх асуултад хариулна уу');return;}
  (state.responses[s.id]??=[]).push({id:'r'+Date.now(),who:state.user.name+' ('+state.user.email+')',date:new Date().toISOString(),answers});
  save();toast('Хариулт амжилттай бүртгэгдлээ');go('answer');
}
function selectSurvey(id){const s=state.surveys.find(x=>x.id===id&&x.owner===state.user.email);if(!s||state.user.role!=='researcher'){toast('Энэ тайланг үзэх эрхгүй байна');return;}state.activeSurvey=id;go('analytics');}
function analytics(m){
  if(state.user.role!=='researcher'){toast('Статистикийн тайлан үзэх эрхгүй байна');go('answer');return;}
  const owned=state.surveys.filter(x=>x.owner===state.user.email),s=owned.find(x=>x.id===state.activeSurvey)||owned[0];
  if(!s){m.innerHTML=head('ANALYTICS','Статистик тайлан','Өгөгдөлд дүн шинжилгээ хийх')+'<div class="panel empty">Өөрийн асуумж үүсгэсний дараа тайлан харагдана.</div>';return;}
  state.activeSurvey=s.id;const rs=state.responses[s.id]||[];
  m.innerHTML=head('ANALYTICS','Статистик тайлан','Давтамж, хувь, тодорхойлох статистик, найдвартай байдал, корреляци.',`<button class="btn green" onclick="exportSurvey('${s.id}')">⇩ XLSX татах</button>`)+`<div class="panel"><div class="field"><label>Судалгаа сонгох</label><select onchange="selectSurvey(this.value)">${owned.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="metric-grid"><div class="metric"><b>${rs.length}</b><span>Нийт оролцогч</span></div><div class="metric"><b>${s.questions.length}</b><span>Асуултын тоо</span></div></div><div class="modal-actions"><button class="btn" onclick="downloadWordReport('${s.id}')">Word тайлан</button><button class="btn" onclick="printReport('${s.id}')">PDF хэвлэх / хадгалах</button></div></div><div class="grid two-col"><section class="panel"><h3 class="section-title">Давтамж ба тархалт</h3>${s.questions.map((q,i)=>renderFrequency(q,i,rs)).join('')}</section><section class="panel"><h3 class="section-title">Тодорхойлох статистик</h3>${renderNumeric(s,rs)}<h3 class="section-title" style="margin-top:22px">Найдвартай байдал</h3>${renderAlpha(s,rs)}<h3 class="section-title" style="margin-top:22px">Корреляцийн матриц</h3>${renderCorrelation(s,rs)}</section></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h3 class="section-title">Түүхий өгөгдөл</h3><button class="btn small" onclick="exportSurvey('${s.id}')">XLSX татах</button></div><div class="table-wrap">${renderTable(s,rs)}</div></div>`;
}
function numericColumns(s,rs){return s.questions.map((q,i)=>({q,index:i,values:['scale','number'].includes(q.type)?rs.map(r=>r.answers[i]).filter(v=>v!==''&&v!==null&&v!==undefined&&!Array.isArray(v)&&Number.isFinite(Number(v))).map(Number):[]})).filter(x=>x.values.length);}
function completeNumericMatrix(s,rs,types=['scale','number']){const cols=s.questions.map((q,i)=>({q,index:i})).filter(x=>types.includes(x.q.type));const rows=rs.map(r=>cols.map(c=>{const v=r.answers[c.index];return v!==''&&v!==null&&Number.isFinite(Number(v))?Number(v):NaN;})).filter(row=>row.length>=2&&row.every(Number.isFinite));return {cols,rows};}
function renderAlpha(s,rs){const d=completeNumericMatrix(s,rs,['scale']),k=d.cols.length;if(k<2||d.rows.length<2)return '<p class="hint">Кронбахын альфа тооцоход 2-оос доошгүй Likert төрлийн асуулт, бүрэн хариулттай 2-оос доошгүй оролцогч шаардлагатай.</p>';const vars=d.cols.map((c,j)=>varianceOf(d.rows.map(r=>r[j]))),totals=d.rows.map(r=>r.reduce((a,b)=>a+b,0)),totalVar=varianceOf(totals),alpha=totalVar>0?k/(k-1)*(1-vars.reduce((a,b)=>a+b,0)/totalVar):NaN;return `<div class="metric"><b>${Number.isFinite(alpha)?alpha.toFixed(3):'Тооцоолох боломжгүй'}</b><span>Cronbach’s alpha · ${k} асуулт · N=${d.rows.length}</span></div><p class="hint">Зөвхөн бүрэн хариулттай Likert асуултуудыг ашиглав. Alpha нь дотоод нийцлийг үнэлэх бөгөөд хэмжүүрийн хүчин төгөлдөр байдлыг дангаараа батлахгүй.</p>`;}
function renderCorrelation(s,rs){const d=completeNumericMatrix(s,rs);if(d.cols.length<2||d.rows.length<3)return '<p class="hint">Корреляцийн матрицад 2-оос доошгүй тоон/Likert асуулт, 3-аас доошгүй бүрэн хариулт шаардлагатай.</p>';const html='<div class="table-wrap"><table><thead><tr><th>Хувьсагч</th>'+d.cols.map(c=>'<th>'+esc(c.q.title.slice(0,22))+'</th>').join('')+'</tr></thead><tbody>'+d.cols.map((c,i)=>'<tr><th>'+esc(c.q.title.slice(0,22))+'</th>'+d.cols.map((z,j)=>{const x=d.rows.map(r=>r[i]),y=d.rows.map(r=>r[j]),v=i===j?1:pearson(x,y);return '<td>'+(Number.isFinite(v)?v.toFixed(3):'—')+'</td>';}).join('')+'</tr>').join('')+'</tbody></table></div>';return html+'<p class="hint">Pearson корреляцийн коэффициент (r). Корреляци нь шалтгаант холбоог нотлохгүй. N='+d.rows.length+'.</p>';}
function copySurvey(id){const s=state.surveys.find(x=>x.id===id&&x.owner===state.user.email);if(!s){toast('Асуумжийн холбоос үүсгэх эрхгүй байна');return;}const url=location.origin+location.pathname+'#survey='+encodeURIComponent(id);const message='Холбоос үүслээ. Демо хувилбарт энэ холбоос зөвхөн ижил браузерийн хадгалсан өгөгдөлтэй үед ажиллана.';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>toast(message)).catch(()=>toast(url));else toast('Холбоос: '+url);}
function toggleSurvey(id){const s=state.surveys.find(x=>x.id===id&&x.owner===state.user.email);if(!s||state.user.role!=='researcher'){toast('Энэ асуумжийг өөрчлөх эрхгүй байна');return;}s.status=s.status==='active'?'closed':'active';save();render();}
function createInvite(){if(state.user.role!=='researcher'){toast('Урилгын код үүсгэх эрхгүй байна');return;}const invites=JSON.parse(localStorage.getItem('mups_invites')||'[]'),random=crypto.getRandomValues(new Uint8Array(8)),code='MUPS-'+Array.from(random,b=>b.toString(36).padStart(2,'0')).join('').slice(0,6).toUpperCase();invites.push({code,created:new Date().toISOString(),used:false});localStorage.setItem('mups_invites',JSON.stringify(invites));const box=$('#inviteOutput');if(box)box.innerHTML='<b>Шинэ урилгын код: '+esc(code)+'</b><p class="hint">Демо хувилбарт код зөвхөн энэ браузерт хүчинтэй.</p><button class="btn small" onclick="GenCopyInvite(\''+code+'\')">Код хуулах</button>';toast('Урилгын код үүслээ');}
function account(m){m.innerHTML=head('PROFILE','Миний бүртгэл','Хэрэглэгчийн мэдээлэл, эрхийн тохиргоо.')+`<div class="panel" style="max-width:680px"><div class="field"><label>Нэр</label><input value="${esc(state.user.name)}" disabled></div><div class="field"><label>И-мэйл</label><input value="${esc(state.user.email)}" disabled></div><div class="field"><label>Эрхийн төрөл</label><input value="${state.user.role==='participant'?'Оролцогч':'Судлаач'}" disabled></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0">${state.user.role==='researcher'?'<h3 class="section-title">Хэрэглэгч урих</h3><p class="hint">Нээлттэй бүртгэл хэвээр ажиллана. Нэмэлтээр урилгын код үүсгэж болно.</p><button class="btn primary" onclick="createInvite()">＋ Урилгын код үүсгэх</button><div id="inviteOutput" style="margin-top:14px"></div>':''}<p class="hint" style="margin-top:18px">Одоогоор хэрэглэгчийн бүртгэл, урилгын код, асуумж болон хариулт зөвхөн энэ браузерт хадгалагдана. Бодит хамтын хэрэглээнд серверийн authentication, өгөгдлийн сан болон RLS шаардлагатай.</p></div>`;}
async function authSubmit(e){
  e.preventDefault();const form=e.target,button=form.querySelector('button[type="submit"]')||form.querySelector('button:not([type])');if(button?.disabled)return;if(button)button.disabled=true;
  try{
    const f=new FormData(form),email=String(f.get('email')||'').trim().toLowerCase(),password=String(f.get('password')||'');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('И-мэйл хаягаа зөв оруулна уу');return;}
    if(password.length<8||password.length>128){toast('Нууц үг 8–128 тэмдэгт байх ёстой');return;}
    if(!window.crypto?.subtle){toast('Нууц үгийн баталгаажуулалт хийхийн тулд HTTPS хаягаар нээнэ үү');return;}
    const accounts=JSON.parse(localStorage.getItem('mups_accounts')||'[]');let user;
    if(state.authMode==='register'){
      const name=String(f.get('name')||'').trim();if(!name){toast('Овог, нэрээ оруулна уу');return;}
      if(accounts.some(a=>a.email===email)){toast('Энэ и-мэйл өмнө нь бүртгэгдсэн байна');return;}
      const code=String(f.get('inviteCode')||'').trim().toUpperCase();let pendingInvite=null;
      if(code){const invites=JSON.parse(localStorage.getItem('mups_invites')||'[]');pendingInvite=invites.find(x=>x.code===code&&!x.used);if(!pendingInvite){toast('Урилгын код буруу эсвэл ашиглагдсан байна');return;}}
      const salt=Array.from(crypto.getRandomValues(new Uint8Array(16))),passwordHash=await authPasswordHash(password,salt),latest=JSON.parse(localStorage.getItem('mups_accounts')||'[]');
      if(latest.some(a=>a.email===email)){toast('Энэ и-мэйл өмнө нь бүртгэгдсэн байна');return;}
      user={name,email,role:f.get('role')==='participant'?'participant':'researcher'};latest.push({email,salt,passwordHash,user});localStorage.setItem('mups_accounts',JSON.stringify(latest));
      if(pendingInvite){const invites=JSON.parse(localStorage.getItem('mups_invites')||'[]'),hit=invites.find(x=>x.code===code&&!x.used);if(hit){hit.used=true;localStorage.setItem('mups_invites',JSON.stringify(invites));}}
      toast('Бүртгэл амжилттай үүслээ');
    }else{
      const account=accounts.find(a=>a.email===email);if(!account){toast('Энэ и-мэйл бүртгэлгүй байна. Эхлээд бүртгүүлнэ үү');return;}
      const hash=await authPasswordHash(password,account.salt);if(hash!==account.passwordHash){toast('И-мэйл эсвэл нууц үг буруу байна');return;}user=account.user;
    }
    state.user=user;sessionStorage.setItem('mups_session',JSON.stringify({email:user.email}));render();
  }catch(error){console.error(error);toast('Нэвтрэх үйлдэл амжилтгүй боллоо. Дахин оролдоно уу');}
  finally{if(button)button.disabled=false;}
}
try{const session=JSON.parse(sessionStorage.getItem('mups_session')||'null'),accounts=JSON.parse(localStorage.getItem('mups_accounts')||'[]'),account=session?.email?accounts.find(a=>a.email===session.email):null;state.user=account?.user&&account.user.email===session.email&&['researcher','participant'].includes(account.user.role)?account.user:null;if(!state.user)sessionStorage.removeItem('mups_session');}catch(e){state.user=null;sessionStorage.removeItem('mups_session');}
render();
</script>
</body></html>
